[general]
bypass-system-proxy=false

[custom_proxy_group]

# 手动选择组
custom_proxy_group=🚀 手动切换`select`[]DIRECT

# Gemini 英美组
custom_proxy_group=🔮 Gemini`select`(UK|英国|London|伦敦|GB|美|US|United States|美国|Los Angeles|洛杉矶|波特兰|圣何塞|凤凰城|达拉斯)`[]🚀 手动切换`[]DIRECT

# YouTube 视频
custom_proxy_group=📺 YouTube视频`url-test`(YouTube|YTB|ytb|视频)`[]🚀 手动切换`[]DIRECT

# YouTube RTMP 推流
custom_proxy_group=📡 RTMP推流`select`(日本W05|日本W06|RTMP|上传|upload)`[]🚀 手动切换`[]DIRECT

# Discord 通话使用 SS/IEPL 节点
custom_proxy_group=🎧 Discord通话`select`(IEPL|SS|discord)`[]🚀 手动切换`[]DIRECT

# giffgaff.com 特殊策略组（轮询尝试）
custom_proxy_group=📱 Giffgaff`fallback`(Giffgaff|UK|英国|giffgaff)`[]🚀 手动切换`[]DIRECT

# 默认代理策略组（可用于一般流量）
custom_proxy_group=🌐 代理`select`[]🚀 手动切换`[]DIRECT


[custom_rule]

# Gemini 用例
DOMAIN-SUFFIX,gemini.google.com,🔮 Gemini
DOMAIN-KEYWORD,gemini,🔮 Gemini

# YouTube 视频和直播
DOMAIN-SUFFIX,youtube.com,📺 YouTube视频
DOMAIN-SUFFIX,ytimg.com,📺 YouTube视频
DOMAIN-KEYWORD,youtube,📺 YouTube视频
DOMAIN-KEYWORD,googlevideo,📺 YouTube视频

# RTMP 推流（如 OBS 使用）
DOMAIN-KEYWORD,rtmp,📡 RTMP推流
DOMAIN-SUFFIX,googleapis.com,📡 RTMP推流

# Discord
DOMAIN-SUFFIX,discord.com,🎧 Discord通话
DOMAIN-SUFFIX,discord.gg,🎧 Discord通话
DOMAIN-KEYWORD,discord,🎧 Discord通话

# giffgaff
DOMAIN-SUFFIX,giffgaff.com,📱 Giffgaff

# fallback 默认走代理
MATCH,🌐 代理
